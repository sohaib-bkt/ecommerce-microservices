syntax = "proto3";

package ecommerce.product.v1;

import "common/v1/common.proto";

// ProductStatus is the publish state of a catalog product.
enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_ARCHIVED = 3;
}

// Product is a sellable catalog item owned by the product service.
message Product {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  ecommerce.common.v1.Money price = 5;
  string currency = 6;
  int32 stock_quantity = 7;
  ProductStatus status = 8;
  repeated string category_ids = 9;
  ecommerce.common.v1.Timestamp created_at = 10;
  ecommerce.common.v1.Timestamp updated_at = 11;
}

// GetProductRequest identifies the product to retrieve.
message GetProductRequest {
  string id = 1;
}

// GetProductResponse carries the requested product.
message GetProductResponse {
  Product product = 1;
}

// ListProductsRequest requests a page of products.
message ListProductsRequest {
  ecommerce.common.v1.PageRequest page = 1;
  string category_id = 2;
  ProductStatus status = 3;
}

// ListProductsResponse carries a page of products.
message ListProductsResponse {
  repeated Product products = 1;
  ecommerce.common.v1.PageResponse page = 2;
}

// SearchProductsRequest searches indexed products by name, SKU, or description.
message SearchProductsRequest {
  string query = 1;
  ecommerce.common.v1.PageRequest page = 2;
}

// SearchProductsResponse carries matching products and pagination metadata.
message SearchProductsResponse {
  repeated Product products = 1;
  ecommerce.common.v1.PageResponse page = 2;
}

// CreateProductRequest adds a new catalog product.
message CreateProductRequest {
  string sku = 1;
  string name = 2;
  string description = 3;
  ecommerce.common.v1.Money price = 4;
  int32 stock_quantity = 5;
  repeated string category_ids = 6;
}

// CreateProductResponse carries the newly created product.
message CreateProductResponse {
  Product product = 1;
}

// UpdateProductRequest mutates an existing product. Only provided fields are changed.
message UpdateProductRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  ecommerce.common.v1.Money price = 4;
  ProductStatus status = 5;
}

// UpdateProductResponse carries the updated product.
message UpdateProductResponse {
  Product product = 1;
}

// ReserveStockRequest decrements available stock for a product. Reservation is
// idempotent on reservation_id so retries cannot double-decrement stock.
message ReserveStockRequest {
  string product_id = 1;
  int32 quantity = 2;
  string reservation_id = 3;
}

// ReserveStockResponse reports the remaining stock after the reservation.
message ReserveStockResponse {
  string product_id = 1;
  int32 remaining_stock = 2;
  bool fulfilled = 3;
}

// ReleaseStockRequest returns reserved stock back to the available pool.
message ReleaseStockRequest {
  string product_id = 1;
  int32 quantity = 2;
  string reservation_id = 3;
}

// ReleaseStockResponse reports the remaining stock after the release.
message ReleaseStockResponse {
  string product_id = 1;
  int32 remaining_stock = 2;
}

// ProductService manages the product catalog and stock levels.
service ProductService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}
